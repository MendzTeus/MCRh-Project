server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

  # `add_header` isn't inherited into a location block that sets its own
  # `add_header` (an nginx quirk), so these are repeated below in /assets/
  # and /media/ rather than relying on inheritance from this server block.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # unsafe-inline in script-src is required by the font preload swap in index.html;
  # every other directive is locked to the exact external hosts the app actually uses
  # (Supabase storage, Leaflet marker icons on unpkg, CARTO map tiles, Google Fonts).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co https://unpkg.com https://*.basemaps.cartocdn.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location /media/ {
    alias /var/www/mcrh/media/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
    # Photo uploads travel as base64 JSON — allow bodies up to the API's limit.
    client_max_body_size 20m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
